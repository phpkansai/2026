# 公開URL（決まったら設定。OGPやcanonicalに使われます。末尾スラッシュなし）
url: ""

event:
  name: "PHPカンファレンス関西2026"
  name_en: "PHP Conference Kansai 2026"
  date_label: "2027年1月16日(土)"
  date_iso: "2027-01-16"
  description: "PHPカンファレンス関西2026 は 2027年1月16日(土) 京都リサーチパークで開催されます。"

venue:
  name: "京都リサーチパーク 4号館"
  postal: "〒600-8815"
  address: "京都府京都市下京区中堂寺粟田町93"
  access: |
    駅からのアクセス駅からのアクセス駅からのアクセス駅からのアクセス駅からのアクセス駅からのアクセス
  # Googleマップの埋め込みURL（APIキー不要）
  map_embed_url: "https://www.google.com/maps?q=%E4%BA%AC%E9%83%BD%E3%83%AA%E3%82%B5%E3%83%BC%E3%83%81%E3%83%91%E3%83%BC%E3%82%AF4%E5%8F%B7%E9%A4%A8&hl=ja&z=16&output=embed"
  map_link_url: "https://maps.google.com/?q=京都リサーチパーク4号館"

# fortee 連携（イベントスラッグ。APIのURLは https://fortee.jp/<slug>/api/... ）
fortee:
  slug: "phpcon-kansai2026"
  base_url: "https://fortee.jp"

# ボタンや外部リンク（ダミー → 決まり次第差し替え）
links:
  register: "https://fortee.jp/phpcon-kansai2026"          # 参加申し込み
  proposal: "https://fortee.jp/phpcon-kansai2026/speaker/proposal/cfp"  # forteeで応募する
  timetable_external: "https://fortee.jp/phpcon-kansai2026/timetable"   # タイムテーブル（外部）
  x: "https://x.com/phpcon_kansai"
  note: "https://note.com/phpcon_kansai"

# タイムテーブルのナビ先: auto | internal | external
#   auto     … forteeのタイムテーブルにデータがあればサイト内 /timetable/ 、無ければ外部リンク
#   internal … 常にサイト内 /timetable/
#   external … 常に links.timetable_external
timetable:
  mode: auto

news:
  # トップページに表示する最大件数
  limit: 5

