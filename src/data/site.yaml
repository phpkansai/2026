# =============================================================
# サイト全体の設定
# URLや文言はここを書き換えれば反映されます（再ビルドが必要）
# =============================================================

# 公開URL（決まったら設定。OGPやcanonicalに使われます。末尾スラッシュなし）
url: "https://2026.kphpug.jp"

event:
  name: "PHPカンファレンス関西2026"
  name_en: "PHP Conference Kansai 2026"
  date_label: "2027年1月16日(土)"
  date_iso: "2027-01-16"
  description: "PHPカンファレンス関西2026 は 2027年1月16日(土) 京都リサーチパークで開催されます。"

venue:
  name: "京都リサーチパーク 4号館"
  postal: "〒600-8815"
  address: "京都府京都市下京区中堂寺粟田町93"
  access: |
    JR嵯峨野線（山陰線）2駅（約5分）　丹波口駅下車 西へ徒歩5分
  # Googleマップの埋め込みURL（APIキー不要）
  map_embed_url: "https://www.google.com/maps?q=%E4%BA%AC%E9%83%BD%E3%83%AA%E3%82%B5%E3%83%BC%E3%83%81%E3%83%91%E3%83%BC%E3%82%AF4%E5%8F%B7%E9%A4%A8&hl=ja&z=16&output=embed"
  map_link_url: "https://maps.google.com/?q=京都リサーチパーク4号館"

# fortee 連携（イベントスラッグ。APIのURLは https://fortee.jp/<slug>/api/... ）
fortee:
  slug: "phpcon-kansai2026"
  base_url: "https://fortee.jp"

# ヒーローのボタンとナビ末尾のリンク（同じ文言・同じ飛び先）
# 現在はページ内のリンク集「絶賛募集中！」へスクロールする。
# 参加申し込みが始まったら label を「参加申し込み」、href を links.register のURLに変える想定。
cta:
  label: "プロポーザル・スポンサー募集中！"
  href: "#recruit"

# ボタンや外部リンク（ダミー → 決まり次第差し替え）
links:
  register: "https://fortee.jp/phpcon-kansai2026"          # 参加申し込み（未使用。cta.href に入れると使われる）
  proposal: "https://fortee.jp/phpcon-kansai2026/speaker/proposal/cfp"  # forteeで応募する
  timetable_external: "https://fortee.jp/phpcon-kansai2026/timetable"   # タイムテーブル（外部）
  x: "https://x.com/phpcon_kansai"
  note: "https://note.com/phpcon_kansai"

# アクセス解析
# gtm_container_id … Google タグマネージャーのコンテナID（GTM-XXXXXXX）。入れると全ページに GTM が入ります。
#                     GA4 の測定ID（G-XXXXXXXXXX）は GTM の管理画面で「Google タグ」として設定します。
# ga_measurement_id … GTM を使わず GA4 を直接入れたいときだけ使う（G-XXXXXXXXXX）。GTM と併用すると二重計測になるので空にしておく。
# どちらも空なら何も出力しません。本番ビルド（npm run build）のときだけ有効で、開発サーバーでは送信しません。
# 来年以降も同じコンテナ・同じプロパティを使い回す想定です（年はホスト名で区別できます）。
analytics:
  gtm_container_id: ""
  ga_measurement_id: "G-ZHZR7DH1FC"

# 短縮URL（印刷物のQRコード用）
# /go/<キー>/ にアクセスすると to の URL へ転送します。印刷後でも飛び先や UTM を変えられます。
# UTM の付け方は docs/utm.md を参照。
redirects:
  flyer: "/?utm_source=flyer&utm_medium=qr&utm_campaign=cfp"

# セクションの表示 / 非表示（true で表示）。非表示にするとナビのリンクも消えます。
sections:
  news: true
  proposal: false             # プロポーザル
  recruit: true               # リンク集「絶賛募集中！」
  sponsors: true              # スポンサー（fortee ＋ sponsors.yaml）
  speakers: true              # スピーカー（fortee の採択済みプロポーザル）
  individual_sponsors: true   # 個人スポンサー（fortee のスポンサーのうち individual_sponsors.plans のプラン）
  staff: true                 # スタッフ（fortee ＋ staff.yaml）
  timetable: false            # ナビの「タイムテーブル」リンク（/timetable/ ページ自体は生成されます）

# 開発サーバー（npm run dev / docker compose up）でのみ有効な見た目確認用の設定。
# dummy_data: true にすると、データがまだ無いセクション（スピーカー・個人スポンサー・当日スタッフ・空のスポンサーランクなど）を
# グレーの仮要素で埋めて表示します。npm run build（本番）では無視されるので、true のままでも公開には影響しません。
preview:
  dummy_data: true

# タイムテーブルのナビ先: auto | internal | external
#   auto     … forteeのタイムテーブルにデータがあればサイト内 /timetable/ 、無ければ外部リンク
#   internal … 常にサイト内 /timetable/
#   external … 常に links.timetable_external
timetable:
  mode: auto

news:
  # トップページに表示する最大件数
  limit: 5

message:
  title: "次は、ここから始まる。"
  lead:
    - "超スピードで変わり続けるエンジニアの世界で"
    - "「次」を始めるための発見と繋がりをみつける場所をめざす"
  # 実行委員長の挨拶（1要素 = 1段落）
  body:
    - "PHPカンファレンス関西は、関西のPHPerが集まり、技術や経験を共有する技術カンファレンスです。2024年の大阪、2025年の神戸に続き、2026年は京都で開催します。関西の三大都市を巡ることで、「関西の」カンファレンスとして、より多くの人を巻き込んでいきたいと考えています。"
    - "AIの発展で、私たちの仕事のスタイルは大きく変わりました。しかし、AIから引き出せる答えは、問いを立てる側の知識に左右されます。何を聞くべきか、返ってきた答えは妥当かを判断するには、自分の外側にある知識と出会い、守備範囲を広げていくことが欠かせません。そのため、セッションや登壇、廊下での立ち話といった同じ知識の土台を持つ人同士での双方向コミュニケーションは、今も変わらずに求められているカンファレンスの価値だと考えています。"
    - "今年のテーマは「次は、ここから始まる」。関西で知識と人が交わる場をつくること、変化をチカラに変えること、カンファレンス初心者も含めてまわりを巻き込むこと。この3つを軸に、自分の知識を広げ、次に来る変化を自分のものにできる場を目指します。"
    - "ぜひ京都で、「次」を始めるきっかけを一緒に見つけましょう。皆さまのご参加をお待ちしています。"
  signature:
    - "PHPカンファレンス関西2026"
    - "実行委員長　加納悠史"

# 開催概要（実行委員長の挨拶の下に表示する参加資格と会場カード）
overview:
  eligibility:
    label: "参加資格"
    body:
      - "PHPを使っている人、PHPを使っていた人、PHPに興味がある人など、PHPに関係する人全てに参加資格があります。"
      - "自身の情報アップデートのためにもぜひお越しください！！"
  # 会場・アクセスのカード（日時・住所・地図）を開催概要の下に表示するか
  show_venue_card: true

# スタッフとフッターの間のリンク集
recruit:
  title: "絶賛募集中！"
  items:
    - icon: proposal          # proposal / sponsor / request
      title: "プロポーザル"
      deadline: "締切：2026年10月31日（土）"
      button: "forteeで応募"
      url: "https://fortee.jp/phpcon-kansai2026/speaker/proposal/cfp"
    - icon: sponsor
      title: "スポンサー"
      deadline: "締切：2026年11月6日（金）"
      button: "資料を見る"
      url: "https://docs.google.com/presentation/d/1L8lzrsSyK7unjY8-43bz7bi_nQ_M-DJkz5hGH_EkiD8/edit?slide=id.g33ec3a8be6e_0_102#slide=id.g33ec3a8be6e_0_102"
    - icon: request
      title: "リクエストーク"
      wide: true               # 1列で中央に大きく表示
      description: |
        リクエストークとは、自分がカンファレンスで聞いてみたいトークをリクエストできるしくみです。
        いままで登壇したことがない人も、あまりカンファレンスに参加したことがなかった人も、
        リクエストークを使ってカンファレンスづくりに参加してみよう！
      button: "リクエストする"
      url: "https://requestalk-2026.kphpug.jp/"

proposal:
  title: "プロポーザル"
  body: |
    ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキスト
  button_label: "forteeで応募する"

# プロポーザル募集締切カウントダウン（/proposal_countdown/）
# deadline ＋ grace_minutes を過ぎると自動で「募集は終了しました」表示になり、応募ボタンが無効になります。
# 応募数・新着は fortee の proposals API をブラウザから10秒ごとに取得します。
proposal_countdown:
  deadline: "2026-10-31T23:59:59+09:00"
  deadline_label: "2026年10月31日（土）23:59"
  # アディショナルタイム（分）。締切を過ぎてもこの時間だけは「募集は終了しました」を出さず、応募ボタンも押せるままにする。
  # 締切直前に駆け込みで書いている人を、カウントダウンが 0 になった瞬間に締め出さないための意図。
  # fortee 側の募集締切もこの分だけ遅らせておくこと（ボタンが押せても fortee で締め切られていると応募できない）。
  grace_minutes: 60
  # 「プロポーザル募集について」の本文（1要素 = 1段落）
  about:
    - "PHPカンファレンス関西2026では、PHPやPHP周辺の技術に関するセッションを募集しています。あなたの知識や経験を共有し、PHPコミュニティに貢献しませんか？"
    - "初めての登壇でも大丈夫です。実行委員会がサポートします。ぜひ、あなたの経験や知識を共有してください！"
  theme: "今年のテーマは「次は、ここから始まる」です。聴いた人が「次」を始めるきっかけになるようなトークを期待しています。"
  # 「トークテーマに迷ったら」でリクエストークへ誘導する
  requestalk:
    body: "参加者が「カンファレンスで聞いてみたいトーク」をリクエストできる「リクエストーク」をのぞいてみてください。あなたの経験が、誰かが聞きたかったトークかもしれません。"
    link_label: "リクエストークを見る"
    url: "https://requestalk-2026.kphpug.jp/"

# スポンサーのランク定義（表示順 = この順。columns は PC での1行あたりの枚数）
# plans … fortee のプラン名（管理画面で付けた名前）。この名前のプランに入っている会社をこのランクとして表示します。
#         省略時は id と label に一致するプランを拾います。大文字小文字は区別しません。
sponsor_tiers:
  - id: platinum
    label: "プラチナスポンサー"
    columns: 1
    plans: ["platinum", "プラチナ", "プラチナスポンサー"]
  - id: gold
    label: "ゴールドスポンサー"
    columns: 2
    plans: ["gold", "ゴールド", "ゴールドスポンサー"]
  - id: silver
    label: "シルバースポンサー"
    columns: 3
    plans: ["silver", "シルバー", "シルバースポンサー"]
  - id: bronze
    label: "ブロンズスポンサー"
    columns: 4
    plans: ["bronze", "ブロンズ", "ブロンズスポンサー"]

# スポンサーセクションの見出しと説明文（description は1要素 = 1行）
sponsors:
  title: "スポンサー"
  description:
    - "PHPカンファレンス関西2026は、スポンサー企業様のご協力により開催されます。"
    - "スポンサー企業様のご支援を心より感謝申し上げます。"
  empty: "スポンサー募集中です。"

# 個人スポンサー（fortee のスポンサーのうち、plans に挙げたプラン名の人を丸いアイコンで表示）
individual_sponsors:
  title: "個人スポンサー"
  description:
    - "PHPカンファレンス関西2026にご支援いただいた個人スポンサーの皆様です。"
    - "温かいご支援をありがとうございます！"
  empty: "個人スポンサー募集中です。"
  plans: ["individual", "個人", "個人スポンサー"]

# スピーカー（fortee の採択済みプロポーザルから自動で作られます）
speakers:
  title: "スピーカー"
  description:
    - "PHPカンファレンス関西2026では、PHPに関する様々なトピックについて、"
    - "公募で選ばれたスピーカーによる講演を行います。"
    - "スピーカーの皆様のご協力に感謝申し上げます。"
  empty: "スピーカーは採択が決まり次第、掲載します。"

# スタッフ（fortee のスタッフ ＋ staff.yaml。実行委員長・副実行委員長の指定は staff.yaml の leaders）
staff:
  title: "スタッフ"
  description:
    - "PHPカンファレンス関西2026は、関西のPHPコミュニティの有志スタッフによって運営されています。"
    - "当日は会場でお気軽にお声がけください。"
  empty: "準備中です。"

footer:
  organizer: "PHPカンファレンス関西2026実行委員会"
  copyright: "Copyright © Kansai PHP Users Group"
  past_events:
    - { label: "2015", url: "https://conference.kphpug.jp/2015/" }
    - { label: "2016", url: "https://conference.kphpug.jp/2016/" }
    - { label: "2017", url: "https://2017.kphpug.jp/" }
    - { label: "2018", url: "https://2018.kphpug.jp/" }
    - { label: "2024", url: "https://2024.kphpug.jp/" }
    - { label: "2025", url: "https://2025.kphpug.jp/" }
