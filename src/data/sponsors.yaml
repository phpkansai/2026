# =============================================================
# スポンサーの補助設定（一覧の本体は fortee のスポンサーAPI）
#   - fortee に登録されているスポンサーは、再ビルド時に自動でランクごとに表示されます（社名・URL・ロゴ）。
#     ロゴは fortee にアップロードされたものを使います。fortee にロゴが無い間は、ここの logo があればそれを使い、
#     どちらも無ければ社名入りのグレーの枠で表示されます。
#   - ここに書いた会社が fortee にもいる場合（社名で照合）は、logo / url の補完にだけ使われます。
#     fortee にいない会社は、そのままランクに追加表示されます（fortee を使わない場合の手動運用もできます）。
#   - tier: platinum / gold / silver / bronze （site.yaml の sponsor_tiers）
#   - logo: src/assets/sponsors/ に置いた画像ファイル名（png / svg / jpg / webp）
# =============================================================

