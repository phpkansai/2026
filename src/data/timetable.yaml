- track: "Track A"
  start: "17:10"
  end: "17:15"
  title: "AI は PHP の暗黙知を読み解けるのか"
  type: talk
  speaker: "勝佐拓也"
  speaker_twitter: "kitkattsun0531"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/2156d1ca-14d7-4519-baa3-5f61b40cd30e.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/e5e4bbdb-e6cf-4d17-8fe7-f85f96175e57"
  abstract: |
    普段何気なく書いている PHP のコード。
    その裏側で何が起きているか、意識したことはありますか？
    マジックメソッドや型変換、参照など、PHP にはコードの見た目だけでは分かりにくい挙動があります。
    PHPer は経験や知識を頼りに、こうしたコードの裏側を読み解いています。
    では、 AI はどうでしょうか？
    今回は、PHP のコードを AI に読み込ませ、どこに着目し、何を手掛かりに、どのような手順で理解していくのかを追ってみます。
    AI は PHPer とは異なるアプローチで、 PHP の暗黙知を読み解くのでしょうか？

- track: "Track A"
  start: "17:15"
  end: "17:20"
  title: "PHPコミュニティのおかげでPHP2Shellの脆弱性対応を乗り越えられました"
  type: talk
  speaker: "おさない"
  speaker_twitter: "000sak000"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/02789152-81e3-4167-b8e2-e0996eae655d.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/1dc1386f-ebea-4fbf-b9c9-0ad7098e7d5d"
  abstract: |
    PHPの重大な脆弱性対応に、当社の現場でも対応に追われました。
    この対応を主導してくれたのが、スーさんです。当社のPdMがLaravel Live Japanのスタッフ活動を通じて知り合い、スーさんが仕事を探していたタイミングで声をかけ、お力添えいただいていた経緯があります。
    さらにPHPユーザーズのSlackやTwitterで最新情報を収集できたことや、他のPHPerも同じ課題に向き合っていると感じられたことも心強い支えでした。
    本LTでは、今回の経験を通じて、コミュニティで生まれた縁が、いざというとき現場を支える力になることをお話しします。

- track: "Track A"
  start: "17:20"
  end: "17:25"
  title: "PHPのsortは何ソート？"
  type: talk
  speaker: "Keisuke Ikeda"
  speaker_twitter: "ike_keichan"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/14b683ba-c743-4628-9e78-27b4c355174b.png"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/67facf03-ab64-4ff9-b2d0-e011f6d450a7"
  abstract: |
    皆さんは sort() がどんなソートアルゴリズムで動いているか、意識したことはあるでしょうか？
    ソートと言っても、クイックソート、マージソート、挿入ソートなど、ソートアルゴリズムには多くの種類があります。
    そしてPHPには sort、asort、ksort、usort など十数個のソート関数がありますが、php-src を読むと、どれも最終的に同じ一つの内部関数にたどり着きます。
    本LTでは、その内部関数が何のソートアルゴリズムで動いているのかを php-src のコードとともに解説します。その答えは PHP 5 と 7 で異なり、さらに PHP 8 ではソートアルゴリズムを変えないまま、同じ値を持つ要素の並び順が保証される「安定したソート」になりました。ソートアルゴリズム以外の何を変えたのか、その答えも合わせて解説します。

- track: "Track A"
  start: "17:25"
  end: "17:30"
  title: "独学でPHP学んでそのままPHP使う会社に入ってみた"
  type: talk
  speaker: "jirooooo"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/aeb2e2b7-9b23-462e-9cc8-424db667e930"
  abstract: |
    独学でPHPを覚えて、長期インターンを経てPHPを使う会社に入社し、今もPHPのプロダクトを開発しています。
    独学のころは、引数にintと書いてあれば中身もintだろうと、特に気に留めていませんでした。入社後、古いコードをリファクタするMRをレビューしたとき、そのついでに declare(strict_types=1) を付けたところ、PHPStanのエラーが出続きました。調べると、intと宣言した引数に数字の文字列を渡している箇所がいくつもあり、暗黙の型変換で何年も動いていました。型が書いてあることと型が守られていることは別だと、このとき初めて実感しました。
    このLTでは、この件を中心に、独学で分かったつもりだったことが実務でどう理解し直したかを話します。独学でPHPを学んでいる人、これから実務に入る人向けの発表です。

- track: "Track A"
  start: "17:30"
  end: "17:35"
  title: "『解約予定』をそろえたら、PHPのコードまで直したくなった話"
  type: talk
  speaker: "Taz"
  speaker_twitter: "466548"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/8285877d-6cef-4d69-bf7a-aa2e44f021ab.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/81853d0d-24b0-4d89-9b92-5288262b9bb6"
  abstract: |
    画面の文言を見直していたとき、ひとつの状態を表す言葉が場所によって少しずつ違うことに気づきました。
    デザイナーとして文言をそろえるだけのつもりが、たどっていくとPHPの定数名やメッセージにも同じゆれがありました。
    このLTでは、デザイナーがAIの力を借りながら用語を棚卸しし、UIとコードの言葉をそろえていった過程を紹介します。

    画面の表記ゆれは、どこから生まれるのか
    AIを使って「同じ意味の言葉」を集めてみる
    用語ルールを決めるとき、デザイナーとエンジニアで話し合ったこと
    UIの文言とPHPの命名がそろうと、何がうれしいのか

    対象者

    デザイナーやPMとの用語のすり合わせに興味があるPHPer
    コードが読めるデザイナー、読んでみたいデザイナー

    持って帰れるもの

    AIを使って用語のゆれを洗い出すやり方
    「UIの言葉」と「コードの言葉」をそろえるための考え方

- track: "Track A"
  start: "17:35"
  end: "17:40"
  title: "AIの「もっともらしさ」に流されないために　～認知バイアスとレビューの工夫～"
  type: talk
  speaker: "小泉岳人"
  speaker_twitter: "koitake_"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/0153fbea-b06b-4061-9e8a-45c4853b2bce.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/141f3e52-3df3-4f55-9507-8c396861bbf8"
  abstract: |
    AIが作った設計書や生成物は、一見よくできている。でも、なぜそう作ったのか、自分の言葉で説明できるでしょうか。
    自分の理解を超える成果物を前に「分からない」と言えず、十分にレビューできないまま開発が進む。私自身も、AIの最初の案に引っ張られる一人です。
    本LTでは、アンカリング・説明深度の錯覚など、認知バイアスの考え方を手掛かりに、AIが作った設計書等の生成物をレビューするコツを紹介します。「分からない」「何かおかしい」と感じたとき、どこを確かめ、どうAIに問い直すか。自分自身の認知バイアスを自覚し、成果物の前提や、AIに渡した情報に戻って確認するなど、明日から試せるレビューの工夫をお伝えします。

- track: "Track A"
  start: "17:40"
  end: "17:45"
  title: "フレームワークの外に出てみた"
  type: talk
  speaker: "yamoto95"
  speaker_twitter: "yamoto_95"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/4305688c-451b-4464-8318-d6c5f0afda00.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/bc872840-211c-42f0-aaa1-4caf6b2e0e6f"
  abstract: |
    フレームワークがやってくれていること、素のPHPで書けますか？
    私が初めて書いたPHPはCakePHPでした。
    最初からフレームワークの中にいたので、どこまでがPHPで、どこからがフレームワークの機能なのか、明確に線引きできていませんでした。
    本LTでは、フレームワークの機能を1つずつ外し、いつもの1リクエスト分の処理を素のPHPだけで書き直します。
    普段のコードと並べて、フレームワークが何を肩代わりしていたのかを見ていきます。
    フレームワークからPHPを始めた初心者の目線で、外に出て分かったことをお話しします。

- track: "Track A"
  start: "17:45"
  end: "17:50"
  title: "そのPHP、クラウドにどう載せる？"
  type: talk
  speaker: "大谷優多"
  speaker_twitter: "y___otani"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/61f6cca6-aa04-4771-a8a7-b67cf4af688e.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/57fabb32-36ad-4440-8de8-3c9740a304f4"
  abstract: |
    PHPアプリをクラウドに載せるとき、どんな構成を思い浮かべますか？
    各クラウドには実績豊富な定番の構成があります。もちろん、それらは有力な選択肢です。でも、PHPアプリの載せ方はそれだけではありません。
    例えば、独自ドメインや証明書を用意せずにHTTPSで公開したい。アクセスが少ないなら、常時稼働は避けたい。そんなとき、いつもの構成以外にどんな選択肢があるでしょうか？
    本LTでは、主要クラウドであるAWS・Google Cloud・Azureを題材に、実現したいことに応じて候補となるPHPアプリの載せ方を紹介します。

