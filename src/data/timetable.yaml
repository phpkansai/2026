  end: "13:25"
  title: "昼休憩"
  type: timeslot

- track: "Track C"
  start: "13:25"
  end: "13:45"
  title: "SaaSを守り抜け!! ― 実際に受けた攻撃から学ぶPHP実装の防御術とAIペネトレーションテスト"
  type: talk
  speaker: "Arimoto"
  speaker_twitter: "ixcy"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/2025793b-2c81-4200-8e0f-6e28d713e15e.jpeg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/6c4712a7-c209-46de-bdc6-1989fd29ebd7"
  abstract: |
    サービス停止、情報漏洩、不正アクセス。SaaSをめぐるセキュリティインシデントのニュースが、毎週のように流れる時代になりました。インターネットに公開されたSaaSは、公開した瞬間から、ボットによる自動スキャンや標的型の攻撃にさらされ続けます。
    私達が開発・運用しているSaaSも例外ではなく、運用の中で脆弱性スキャンやインジェクション試行などの攻撃を実際に受けてきました。
    本セッションでは、実際に受けた攻撃の傾向をもとに、どのような攻撃があったのか、そして実装の際にどのような点に気をつけるべきかをPHPエンジニアの視点でお伝えします。
    さらに、AIペネトレーションツールによる脆弱性診断の実践結果も紹介します。何が見つかったのか、人手の診断とどう使い分けるべきかを、実体験をもとに解説します。

- track: "Track C"
  start: "13:55"
  end: "14:15"
  title: "組み合わせテストと向き合う──ペアワイズ法の考え方と実践"
  type: talk
  speaker: "kuma"
  speaker_twitter: "bath_poo_"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/25852558-e55c-40e5-bd99-98a811ade480.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/56f24786-a728-45ed-9e30-e506634af52f"
  abstract: |
    「組み合わせテスト」において、組み合わせ数の多さから全網羅することが難しいケースに遭遇したことはありませんか？
    この問題へのアプローチの1つが「ペアワイズ法」です。「多くの不具合は1〜2条件の相互作用によって起きる」という経験則に基づき、組み合わせ数を抑えつつ効果的な検証を可能にします。
    本セッションでは、ペアワイズ法の考え方を解説します。さらに、PHPで実装されたライブラリを用い、PHPからペアワイズ法を利用する例を紹介します。
    想定する対象者層

    ペアワイズ法を使ったことがない方
    テストケースの選び方に根拠を持たせたい方

    本トークで話すこと

    組み合わせテストの難しさ
    ペアワイズ法の基本的な考え方と向き・不向き
    PHPUnitを使った実装例

    本トークで話さないこと

    アルゴリズムの詳しい実装
    ペアワイズ法以外の組み合わせテスト技法

- track: "Track C"
  start: "14:30"
  end: "14:50"
  title: "責任を \"取る\" のではなく \"持つ\" 〜AI時代に人間に残る仕事 2026〜"
  type: talk
  speaker: "たつきち"
  speaker_twitter: "ttskch"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/aa519880-cc26-4f55-bdc5-6a80b56b8cc3.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/6703be7c-811b-4349-acd7-28d9ebf4d714"
  abstract: |
    「AIは責任を取れない、だから人間が必要」と言われますが、一方で「人間も大して責任取らないじゃん」なんて声もあります。
    私は「責任を取るのが上司の仕事」という言葉に昔から違和感がありました。上司が責任を取って罰を受けても、何が解決するわけでもないからです。
    違和感を解く鍵は、責任を「取る」と「持つ」を分けて考える事でした。この整理は、AI責任論にも一つの明快な説明を導きます。
    弊社ではもう人間はほぼコードを書いていませんが、それでも受託案件の請負契約では完成を約束し、成果物に責任を持っています。
    本トークでは、責任を「持つ」とは何かを整理した上で、

    AIコードのレビューで弊社が今も見ていること、もう見なくなったこと
    Meta社のレビュー自動化の事例
    弊社で提供している、顧客自身がAIでサイトを更新できる仕組み

    などの紹介を通して、AI時代に人間に残る仕事を考察します。

- track: "Track C"
  start: "15:00"
  end: "15:45"
  title: "【解説】PHP-Parser 100% 45:00 Part1/1【WR】【初見さん歓迎】"
  type: talk
  speaker: "ydah"
  speaker_twitter: "ydah_"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/75365143-a80b-482f-a33e-1940cdbf06d8.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/12f1d742-2a83-4250-a2c8-7276d011baf9"
  abstract: |
    PHPStanやRectorなど、皆さんが日々使うツールを支えるnikic/PHP-Parser。その中身をブラックボックスのまま使っていませんか？
    本トークでは、普段はRubyの構文解析器で暮らしており、構文解析器ファンボーイの私が、偏愛を込めてPHP-Parserの中身を徹底解説します。
    トークンを切り出し、文法定義から生成されたパーサーがASTを組み立て、NodeTraverserやPrettyPrinterがそれを書き換え、出力するまでを実際のコードで辿ります。
    新構文を古いPHPで読む工夫やエラー回復のしくみなど、Rubyのパーサーと比べた設計の工夫にも触れます。
    パーサーは構文の変化を最も受ける場所です。新構文が入ると何が起きるのか。
    ブラックボックスの外の世界と、明日からASTを読み、ツールを使いこなし、自分で書くための視点を持ち帰って貰えるトークにしたいと思います。

- track: "Track C"
  start: "16:00"
  end: "16:20"
  title: "PHP 8.6のライセンス変更から学ぶオープンソースライセンス"
  type: talk
  speaker: "松尾篤"
  speaker_twitter: "matsuo_atsushi"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/249d65d4-00db-4cb3-8bb5-03d9211a565e.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/25841706-94b8-4e3f-8744-d403f7ed4f62"
  abstract: |
    PHP 8.6ではライセンスが三条項BSDライセンスに変更され、長年の課題であったGNU General Public License（GPL）との両立性に関する問題が解消されました。本トークでは、このライセンス変更の内容を題材に、GPL、MIT、BSDなど主要なオープンソースライセンスの基礎知識と実務での注意点を解説します。
    サプライチェーン攻撃のリスクを低減するためにOSS依存を減らし、AIにコードを書かせるという選択もある一方で、AI生成コードにGPLやAGPLなどのコードが知らぬ間に混入するリスクも生まれています。OSSを使うにしてもAIに書かせるにしても、ライセンスの知識は欠かせません。
    PHPカンファレンス福岡2025での発表をベースに、PHP 8.6の最新動向を反映した情報を提供します。自信を持って「次」の一歩を踏み出すために、改めてライセンスを学びましょう。

- track: "Track C"
  start: "16:30"
  end: "16:50"
  title: "𠮷田さんの『𠮷』は、なぜ4トークンなのか — PHP で GPT のトークナイザを書いて、人名の値段を測る"
  type: talk
  speaker: "持田翼"
  speaker_twitter: "tbsmcd"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/9c2ff307-fd2a-4f28-a282-324667135f6e.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/93ffdf56-e0e1-4a7a-a4de-303c4f3f6f7a"
  abstract: |
    GPT-4oでは「吉田」は2トークン、「𠮷田」は5トークンです。同じ読みの名字なのに、料金も入力の上限も違います。
    このトークでは、GPT-4oのトークナイザ(byte-level BPE)をPHPで20行ほど書き、tiktokenと出力を照合します。すると、トークンの切れ目は文字の切れ目と一致しないと分かります。「𠮷」は語彙表に載っておらず、UTF-8の4バイトに砕けて4トークンになる。正規化しても安くならない字があり、安くなる字は別の名前になります。料金だけではありません。ローカルLLMの出力を1トークンずつ受け取ると、文字の途中で切れたバイト列が届き、json_encode()がfalseを返します。
    数値はo200k_baseが中心で、Qwen3やllm-jp-3では違うことも示します。見慣れたstrlenとmb_strlenに続く3つ目の文字数が、請求額を決めています。

