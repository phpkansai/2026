- track: "Track A"
  start: "13:25"
  end: "13:45"
  title: "Laravel 5.8 から最新版まで、稼働中のモノリスを止めずに運んだ 1年間 — AI と一緒にやったモダナイズの全記録"
  type: talk
  speaker: "金谷 敦志"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/53887cbb-da24-4454-b9b1-6c2e5830a838"
  abstract: |
    冷凍宅配食サービス「nosh」は 2026 年1月の時点で Laravel 5.8 / PHP 7.2 のモノリスでした。サブスクリプションも決済も毎日動いていて、止めて作り直す選択肢はありません。
    そこからサービスを止めずにバージョンアップを重ね、発表時点では最新系のLaravel / PHPで動いています。旗振り役の私は、PHP未経験で入社しました。
    LaravelやPHPの非互換をどう乗り越えたのか。
    Python 2→3を上げきった経験をもとに、どんな方針で上げるか、何を守るか、自分が分かっていない穴はどこかをAIと言語化しながら進めました。
    AIに丸投げせず、壊れたら気づけて、すぐ戻せる状態を先に作ったうえで上げています。
    本セッションでは、その方針の立て方、実際の移行時に発生した問題や対処法をお伝えします。
    時間があれば、複数サービス展開に向けたリアーキテクチャの話もします。

- track: "Track A"
  start: "13:55"
  end: "14:15"
  title: "AIで増えた設定やベストプラクティスを、テンプレートを通じて追従させ続ける技術"
  type: talk
  speaker: "Ryosuke Kawamura"
  speaker_twitter: "fair917"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/4bc851fb-ed3e-4ee6-ac99-99e5415f6b60.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/d0c3a08f-05f2-4adf-aee6-3c722b59cfc9"
  abstract: |
    AIコーディングエージェントの普及で、PHPエンジニアが一人でカバーできる範囲は大きく広がり、コンテナやクラウドの設定まで任される場面も増えています。
    一方で、書くのが簡単になった分コードや設定は今までにないペースで増え、プロジェクトごとに少しずつ違う形に育っていきます。
    ミドルウェアやライブラリのバージョン、静的解析やクラウドの設定、そしてエージェント向けの指示ファイルまで、本来維持したい品質や水準とのズレは、時間とともにに広がります。
    このトークでは、CopierとRenovateというツールを組み合わせ、共通のテンプレートに対する改善をPRとして各リポジトリに配布する仕組みについて、実運用で見えたポイントとあわせてお話しします。
    【想定する聴講者】
    ・インフラやCI/CDまで触る機会が増えたPHPエンジニア
    ・複数のプロジェクトのばらつきや改善の横展開に悩んでいる方

- track: "Track A"
  start: "14:30"
  end: "14:50"
  title: "サポート切れのPHP、少しずつ上げるか、そもそも作り直すか"
  type: talk
  speaker: "山岡広幸"
  speaker_twitter: "hiro_y"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/bc2d0169-5575-4143-83ea-9f815752bc85.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/e8b10edb-bc6f-4229-97e6-b99f051cb8fc"
  abstract: |
    2014年の創業から続く自社サービスがあります。
    うまく手をかけてあげられないまま、PHP 7.4のサポートが終わってからも約4年動いていました。
    2026年10月、PHPの重大な脆弱性が告知された日。たまたま前日にCloudflareを前に置いたばかりで、慌てずに済みました。
    Claudeに相談すると、数か月前には無理そうだったPHP 8.3への更新が、あっけなく終わりました。
    これは本当に偶然で、一気にバージョンを上げるのはオススメしません（仕事で何度かやりましたが…大変です）。基本は少しずつ上げましょう。
    それでも一気に上げるしかないときは、AIと一緒にがんばるか、いっそ作り直すか。AIを使って、定期的に作り直すのも現実的になってきました。
    当事者としてこれまでの経緯をふりかえり、PHP 8.3のサポートが切れる2027年末の先をどうしようと考えているかもお話しします。

- track: "Track A"
  start: "15:00"
  end: "15:45"
  title: "5万件のPHP結合テストを1分以内で実行するためにやったこと"
  type: talk
  speaker: "当田 昇"
  speaker_twitter: "picopico_dev"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/ad1d82af-e439-4bca-ae68-a4b672f6467c.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/d28a718d-f859-4fac-a94d-7d06a433fe4d"
  abstract: |
    テスト実行の並列化も実行マシンの強化もやり尽くした後、さらに高速化するにはどうすればいいでしょうか？
    私たちの社内ではアプリケーションの成長とともにPHPテストが増え続け、テストケース数は約5万件に達しました。その多くはDBに接続する重いテストです。マシンの強化と並列数の増加である程度短縮できたものの、実行時間は延び続けていました。
    本セッションでは、実行マシンも並列数も変えずに、テストを3倍以上高速化した手法を紹介します。試した最適化のうち効果があったものとなかったものを、実測値をもとにお話しします。
    対象者
    ・PHPUnitを使ったことがある人
    ・CIのテスト実行の最適化に関心がある人
    話すこと
    ・自前の並列ランナーからParaTestへの移行
    ・ワーカーへのテスト振り分けの最適化
    ・MySQL・php.iniの高速化設定
    ・OPcacheの活用
    ・カバレッジ計測の差分化
    など

- track: "Track A"
  start: "16:00"
  end: "16:20"
  title: "脆弱性のないソフトウェアはなぜ作れないのか 〜不完全性定理という宿命について〜"
  type: talk
  speaker: "田中ひさてる"
  speaker_twitter: "tanakahisateru"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/d8685d8b-28d6-47b0-b270-2b554d165239.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/83cb1227-2612-451a-948a-d4c6191a2ba8"
  abstract: |
    19世紀から20世紀の歴史に遡って、ソフトウェアとは何かという本質を考えてみました。
    私たちが開発しているソフトウェアには、なぜバグや脆弱性が混入するのでしょうか。なぜ脆弱性がないことを証明するソフトウェアを作ることはできないのでしょうか。物語は、19世紀の数理論理学の夢を、1921年のある著書が粉砕したところから始まります。そこから歴史を追いかけると、ソフトウェアという概念そのものに、避けられない本質的な宿命が見えてきます。
    そしていま、全く別のアプローチである、大規模言語モデルが現れました。それは、宿命付けられた不完全性を、ついに超克するのでしょうか。それとも、論理のさらに外を取り囲む、新たな不完全性の系なのでしょうか。人間である私たちは、エンジニア倫理をどのように確立していけばいいでしょうか。
    という戯言を述べたいと思います。

- track: "Track A"
  start: "16:30"
  end: "16:50"
  title: "\"あなたが次の登壇者？一歩踏み出しきれない、プロポーザル提出までの心理的ハードルの外し方\""
  type: talk
  speaker: "DPon"
  speaker_twitter: "DPontaro"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/0b6446c0-dfe7-47a8-bf63-745e6494fe33.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/c8f21fdd-4950-4311-8222-5295a4c86730"
  abstract: |
    カンファレンス登壇ってカッコよくないですか？
    PHPカンファレンス関西2024に参加した際、登壇者の皆さんはとても輝いて見えました。
    刺激を受けて私も登壇機会を頂けました。
    登壇の最初のハードルとなるプロポーザル提出。
    何を出したらいいか、考え出すとキリがなく、最初の提出はボタンを押す手が震えました。
    それでも話したい欲求があったからボタンを押しました。
    一歩踏み出しきれないそこのあなた。
    少しでも「話してみたい」気持ちがあるなら、一緒にハードルを洗い出し、次なる一歩を踏み出しましょう
    ターゲット

    プロポーザル提出に一歩踏み出しきれてない方

    お話すること

    心理的ハードルの洗い出し
    ハードルへの考え方、対策
    ネタの出し方
    提出時に意識していること
    私がプロポーザルを出す理由

    得られること

    プロポーザルを出す勇気
    ネタのひねり出し方

