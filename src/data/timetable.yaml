- track: "Track A"
  start: "10:30"
  end: "11:15"
  title: "「使っているライブラリで脆弱性あるみたいなんだけどどうする」で困らないための脆弱性対応入門"
  type: talk
  speaker: "ASANO MASAKI"
  speaker_twitter: "mackey0225"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/817b1efa-fccb-44a5-92de-8a06f6fa7039.png"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/76ded64d-f9a1-4abf-acf6-632f1c0b086f"
  abstract: |
    システムの開発・運用において、利用している言語やフレームワークなどの脆弱性対応は避けて通れません。
    しかし、組織で取り組もうとすると「何から手をつければいいか分からない」「対応フローや優先順位付けが妥当なのか不安」といった課題にぶつかることも少なくありません。
    さらに、最近の AI を用いた攻撃の高速化・自動化に伴い、初動の的確さと迅速さがより一層求められています。
    本セッションでは、まず「そもそも脆弱性とは何か？」「CVEやCVSSスコアをどう読み解くか」といった基礎知識を整理します。
    その上で、実践している情報収集、トリアージ（リスク評価）、組織内での対応フローといった事例を紹介します。
    また、いざというときのため、普段の開発・保守の中で事前に行える現状整理についてもお話しします。
    組織の規模やフェーズに応じた、現実的で持続可能な脆弱性対応のヒントを持ち帰っていただければ幸いです。

- track: "Track A"
  start: "11:30"
  end: "11:50"
  title: "言語なんて何でもいいAI時代だからこそ、好きなPHPで、生きていく！"
  type: talk
  speaker: "菱田裕美"
  speaker_twitter: "77web"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/574d4c9f-88d3-4f8f-bee6-c6b20a827dc6.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/e5c4b7fe-a2b1-4949-8ccf-b7d905eeba47"
  abstract: |
    私が大好きなのはPHPで、一番得意なのもPHPです。
    2026年、生成AIがどんな言語のプログラムもそれなりに書いてくれる時代になりました。便利ですね。
    今まで手を出しにくかった難解な言語も、苦労しがちだった実行環境も生成AIがなんとかしてくれます。
    プロダクトは、難しさやエンジニアの集めやすさでなく、必要な速度や必要な機能で言語を選んで作れるようになりました。PHPは、AI時代に今から新規プロダクトを作るときに選ばれない言語No.1になったと言えるでしょう。
    しかし、AIがどんな言語も書いてくれるからこそ、好きな言語・得意な言語を活かす方法があると考えて、私は日々実践しています。
    このトークでは、AIと協働して好きな言語を活かす考え方とやり方についてお話します。

- track: "Track A"
  start: "12:00"
  end: "12:20"
  title: "Composerにcooldownがやって来たぞ！(どうやって？)"
  type: talk
  speaker: "きんじょうひでき"
  speaker_twitter: "o0h_"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/3084db54-2b5e-4cc5-8364-137b43dffbce.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/294cbeb8-fa98-4ef6-a2a3-193250b4e3a3"
  abstract: |
    2026年に(いっそう)世間を騒がせたサプライチェーン攻撃について、Composerも急速に対策を進めてきました。
    2.11が10月29日にリリースされ、遂に「cooldwon」も公式にサポートされます。
    Composerのcooldwonは、どんな機能なのでしょう？
    実現にはどんな対応が必要だったのでしょう？
    単に「日時の管理を加える」だけでは十分でなかったために、Packagistと合わせて様々な変更が加えられています。
    改めて「Composerが動く仕組」を復習しつつ、cooldownとその導入に関連する変更を覗いてみましょう。
    話すこと

    Composer・Packagist、compsoer.json/lockって何？概要に触れる(おさらい)
    cooldownの機能や、設定時の挙動
    実現のためにどんな変更が行われたか

