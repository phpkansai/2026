- track: "Track B"
  start: "10:30"
  end: "11:15"
  title: "PHilosoPhy of PHP Tech Debt in the AI Era"
  type: talk
  speaker: "めもり〜☆"
  speaker_twitter: "m3m0r7"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/93581814-4d98-477d-a940-68916bb74e60.png"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/4c4b96ed-018d-437b-b2c3-246cbd48abc9"
  abstract: |
    PHP で作られ，10年，20年と事業を支えてきたプロダクトは珍しくありません。その年月とともに技術的負債も積み上がり，「何を直すべきか」「何を残してよいのか」，時には「そもそも PHP を使い続けるべきなのか」という問いにも直面します。
    一方，すべての負債を返済することが事業にとってあるべき姿とは限りません。AI によって開発や改修のあり方も変わりつつある今，本セッションでは，技術的負債を単なるコード品質の問題ではなく，事業価値，開発速度，運用コスト，人材，リスクといった経営上の問題として捉えます。
    PHP で積み上げてきた資産をどう評価し，何を返し，何を残し，その先へ進むのか。技術と経営の両面から，技術的負債との向き合い方を考えます。

- track: "Track B"
  start: "11:30"
  end: "11:50"
  title: "PHPのシェアードナッシングはどう実現されているのか？php-srcから読み解くリクエストライフサイクル"
  type: talk
  speaker: "荒巻拓哉"
  speaker_twitter: "takaram71"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/90fda5ab-f510-4500-95ce-cb741f7e9b25.png"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/ec530d14-e341-4c93-939d-4bfae3f96a57"
  abstract: |
    PHPでは、リクエストが終わると変数やオブジェクトなどがリセットされ、次のリクエストはまっさらな状態から始まります。これは「シェアードナッシング」と呼ばれるPHPの特徴の一つです。
    初心者の頃の私は、てっきりリクエストごとにPHPのプロセスが起動・終了しているのだと思っていました。しかし実際には、同じプロセスが何度もリクエストを処理しています。
    では、プロセスを再起動せずに、どうやって状態をリセットしているのでしょうか？ また、実はリクエストをまたいで保持されるデータや状態も存在します。
    このトークでは、php-srcのコードをたどりながら、Zend Engineや拡張モジュールが行うリクエストごとの初期化・終了処理と、状態を保持する仕組みを解説します。普段当たり前に使っているPHPの動作が、どのような内部実装に支えられているのかを探っていきます。

- track: "Track B"
  start: "12:00"
  end: "12:20"
  title: "「破られない」守りから「破られても困らない」守りへ"
  type: talk
  speaker: "Roku"
  speaker_twitter: "ad5jp"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/bed2fba0-418a-4969-92ec-0bb766422dd8.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/234ab3d1-c17f-40da-8da5-91b5ffd8e3dd"
  abstract: |
    2026年10月初め頃より、大手企業へのサイバー攻撃、情報漏洩が相次ぎ、個人情報を取り扱う事業者は戦々恐々としていました。
    私たちが保守開発を請け負っているプロジェクトのひとつに、10万人の個人情報や口座情報を扱うLaravel製のWebアプリがありました。防御を強化しようにも、横行する攻撃の手法や経路もなかなか明らかにならない。
    そこで取った選択は「破られた時のダメージを最小限に抑える」対策。
    例えば、機微なデータの暗号化、データストアの分離、データ保持期間の見直しなど。暗号化すると検索できなくなる等の課題に直面しながらも、機能退行とのバランスや、代替手段などを考慮しながら進めていきました。
    完璧な防御はもはや不可能とも言える情勢の中で、我々PHPerに何ができるのか。実体験をもとに、勘所や悩んだポイントも交えてお話します。

- track: "Track B"
  start: "12:20"
  end: "13:25"
  title: "昼休憩"
  type: timeslot

- track: "Track B"
  start: "13:25"
  end: "13:45"
  title: "VMs are back! エージェントと共に作るためのPHP開発環境再入門"
  type: talk
  speaker: "岡本秀高"
  speaker_twitter: "hidetaka_dev"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/fba4293f-7ded-4db5-b359-de05ca831dba.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/435cdc27-9eba-47f6-8338-7d260c9f88b9"
  abstract: |
    かつてVagrantで開発用VMを立てていたPHPerも多いはずです。VMは重く、私たちは軽いDockerへ移りました。しかしAIエージェントと開発する今、前提が変わりました。エージェントはパッケージを入れ、設定を書き換え、読み切れないコマンドを次々に実行します。ホストのカーネルを共有するコンテナでは、隔離が心許ありません。microVMは専用カーネルを持つVMでありながら、コンテナに近い速さで起動し、壊してもsnapshotから一瞬で戻せます。
    本トークでは、microVM上にエージェントへの指示だけでWordPressを構築し、PHP 7.4/8.1/8.3の共存構成と、バージョンごとの並列実行構成でプラグインのテストを動かした実践を紹介します。エージェント時代のPHP開発環境を、もう一度ここから始めましょう。

- track: "Track B"
  start: "13:55"
  end: "14:15"
  title: "二重登録を防ぐlockForUpdate()がデッドロックを招く理由 ― data_locksで見るInnoDBのロック"
  type: talk
  speaker: "ayana"
  speaker_twitter: "ayana_ktkt"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/78f2ec61-2661-450a-a4a6-e5c72b57a04e.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/07cb59a4-4fe8-4844-bb6b-74cb0274ac9d"
  abstract: |
    firstOrCreate()のような「あるか確認して、なければ登録する」処理は、同時に2つのリクエストが来ると二重登録になります。
    ではユニーク制約やlockForUpdate()なら安心でしょうか？
    Laravel 13で、何もしない・ユニーク制約・lockForUpdate()の3つに20並列でリクエストを送り、結果を比べた結果から見えてきたことを発表します。
    挙動は、performance_schema.data_locksで確認します。
    SQLを動かしながらDBの中を追い、最後にWebhookの再送など現実の例にも触れます。
    対象：トランザクションやロックをもっと理解したいLaravelエンジニア
    前提：MySQL 8.4（InnoDB、REPEATABLE READ）

- track: "Track B"
  start: "14:30"
  end: "14:50"
  title: "PHPはPerlから何を受け取ったのか"
  type: talk
  speaker: "うさみけんた"
  speaker_twitter: "tadsan"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/6736d468-318e-4ecb-90cb-2cfdd2ae6aa7.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/8bec3394-4f88-48e5-9b07-48d8f346648c"
  abstract: |
    Perlをご存じでしょうか。PHPに先立って普及したサーバーサイドWebプログラミングのための言語としてのパイオニアとなった言語です。
    Perlは1987年にリリースされた言語ですが、エンジニアというよりは言語学のバックグラウンドを持つ作者・ラリー・ウォールによって従来のプログラミング言語ではまだ一般化されていなかった機能が盛り込まれ、プログラミング言語の歴史を変えた一大特異点のひとつといえます。
    PHPは技術的にはPerlと直接的な関連はないものの、多かれ少なかれ時代的な背景からPerlの影響が垣間見えるポイントがいくつもあります。
    本トークではPHPの言語仕様について「どうしてこうなった」というポイントについてPerlという補助線を引くことで理解し、歴史のダイナミズムを感じましょう！

- track: "Track B"
  start: "15:00"
  end: "15:45"
  title: "安全なアプリケーションを保つために、私たちが日頃からできること"
  type: talk
  speaker: "富所 亮"
  speaker_twitter: "hanhan1978"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/794f4448-a85c-4968-8c28-0ae10b49887a.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/89fcab24-55d0-42e2-b40f-a5ecef3e4c3c"
  abstract: |
    「セキュリティは気になるけど、何から始めればいい？」
    「安全にコードを書くだけで十分？」
    「重大な脆弱性が出たら、すぐに対応できる？」
    サービスの安全は、インフラ・ミドルウェア・アプリケーション・仕様など、複数の層と人々によって支えられています。アプリケーションエンジニアも、その全体の中で自分にできることを考える必要があります。
    本トークでは、PHPの重大な脆弱性への対応経験を交え、安全なアプリケーションを保つための日頃の取り組みを紹介します。
    ・コミュニティから当たり前を学ぶ
    ・セキュアな実装の基本を理解する
    ・本番環境の構成を理解する
    ・修正を速やかに届けるCI/CDを整える
    ・改善を妨げる組織の壁を取り除く
    ・チームを越えて協力できる関係を築く
    特別な対応を可能にするのは、日々の地道な改善です。自分の立場で、明日から何に取り組めるかを持ち帰れるトークを目指します。

- track: "Track B"
  start: "16:00"
  end: "16:20"
  title: "そのテスト、なぜ小さくできない？ 〜6万行のテストを消して見えたPHPコードの境界設計〜"
  type: talk
  speaker: "おぎ"
  speaker_twitter: "ogi_chotdake_se"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/d484f636-8ed5-4cf4-84d0-b8817b3aa7e4.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/5a66c402-37c5-4b3a-8b5b-5937b9ce1e9d"
  abstract: |
    2026年、私は大規模なPHPプロダクトで数万行のテストコードを削除しました。 その結果、「小さくできないテスト」が多数残りました。
    APIテストでしか確認できない、DBや外部I/Oまで通さないと検証できない、それを回避しようとするとモックまみれになってしまう...
    様々な問題を抱えたテストを調べるうちに、これらのテストコードの問題はプロダクトコードの責務や依存の境界が曖昧になっているサインなのでは？と考えるようになりました。
    本トークでは、サンプルコードを使って「重いテスト」を分解しながら、「本当に保証したいもの」や「保証にHTTPやDBは必要か」を見直し、 テストを軽くすることではなく、テスト容易性を設計へのフィードバックとして使い、責務を適切な境界へ移していく考え方を紹介し、テストを直す前にプロダクトコードとその設計を見直すための視点を提供します。

- track: "Track B"
  start: "16:30"
  end: "16:50"
  title: "自分が選んでいないフレームワークの選定理由を、今からでも語れるようになろう"
  type: talk
  speaker: "斉田真也"
  speaker_twitter: "saita_shinya"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/4742ecf5-470b-4ab2-af76-86670e08ce2d.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/71386876-bc1b-4aa1-a919-da6cb77ac731"
  abstract: |
    あなたが開発しているシステムのフレームワーク、その選定理由を語れますか？
    多くの現場でフレームワークは自分が選んだものではなく、入社時にはもう決まっていて、選んだ人はもういないこともある。
    しかしながら「選定理由なんて知らない」と放置するのは勿体ないです。フレームワークの特性を知ることは、パフォーマンス改善にも、セキュリティを疑う力にも直結するからです。
    このトークでは、フレームワークを「機能の多さ」ではなく以下の軸で比較してみます。

    リクエストのライフサイクル
    ミドルウェア
    DIコンテナとコスト
    ORMのSQL生成とエスケープ
    CSRF対策等のデフォルト仕様

    この軸で並べると、「なぜこれが選ばれたのか」「今選ぶなら何が変わるか」が語れるようになります。
    それが出来るようになったら、次は・・・あなたが技術選定をする人間になります。
    これはその最初の一歩。

- track: "Track C"
  start: "10:30"
  end: "11:15"
  title: "1本のリクエストから追う、PHP・DB・ブラウザのメモリ使用量"
  type: talk
  speaker: "ma@me"
  speaker_twitter: "ma_me"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/18e3ea89-f20a-4e84-9ceb-2533ee650a2f.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/33dcb048-acde-4af4-890d-7b7894374039"
  abstract: |
    メモリは限られた資源で、アプリケーションの性能にも影響します。
    PHPは実行時に必要なメモリを管理してくれますが、一方で、データの取得方法や応答の指示によっては、DBやブラウザなど、どこにデータを保持させ、どこでメモリを担保させるかが変わります。
    このセッションでは、通常のAPIリクエスト、大量のメモリを利用するCSV関連のリクエストを例に、
    ブラウザからDBへ問い合わせ、結果を取得し返すまでのメモリの流れを説明します。
    get()やcursor()などの取得メソッドでどれくらい変わるのか、
    CSVを一度に組み立てた場合と逐次出力する場合ではどれだけ変わるのか、その違いを比較しながら、
    各段階でメモリがどこに確保され、いつ解放されるのかを確認します。
    大切な資源管理をAIに任せっきりにせず、開発者でコントロールできるようになりましょう。

- track: "Track C"
  start: "11:30"
  end: "11:50"
  title: "設計の良し悪しを結合バランスで考えてみる"
  type: talk
  speaker: "梶川 琢馬"
  speaker_twitter: "kajitack"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/a5f8db9e-d67e-4138-b992-0c78625d41ce.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/84217ca1-3de3-4ecf-ad30-684dc01fdcc7"
  abstract: |
    大きくなったクラスを役割ごとに分けた。データアクセスを別の層に出した。サービスを分けた。
    けれど、機能追加や仕様変更のたびに、結局いくつものファイルを直している。そんな経験はないでしょうか？
    コードの品質は、関数の複雑さやクラス間の依存の数で計測することは可能です。
    ただ、それだけではこの痛みは分かりません。設計の良し悪しは、モジュール間の結合の仕方に左右されるからです。
    このセッションでは、Vlad Khononov 氏の結合バランスの考え方で、「依存先と何を共有しているか」「結合しているコード同士がどれだけ離れているか」「どれくらい変わりやすいものに依存しているか」という3つの観点を実際にどう活用できるかを紹介します。
    設計の良し悪しを、根拠を持って判断し、チームでの議論に役立ててください！

- track: "Track C"
  start: "12:00"
  end: "12:20"
  title: "AIと開発するために、PHPの何を理解すべきか"
  type: talk
  speaker: "ok@meg"
  speaker_twitter: "GsxP8"
  speaker_avatar: "https://fortee.jp/files/phpcon-kansai2026/speaker/0fff69b8-45f0-489b-87c5-ef3160a1e0ab.jpg"
  url: "https://fortee.jp/phpcon-kansai2026/proposal/f5ef4d38-e708-4e2b-8b93-39cfc416c281"
  abstract: |
    AIが出すPHPコード、皆さんはどのくらい自信を持って読めますか？私は、普段から不安でいっぱいです。
    例えば、このPHPDocは要るか、この動的実装はモダンなのかハックなのか、私の知らないもっと適した設計があるのではないか…などです。
    よく知るアンチパターンならすぐに棄却できます。しかし、自分よりphpを理解している節のあるAIは、妥当な設計なのか、過剰な抽象化・アンチパターンに近しいのか、判断に迷うコードを出すことも少なくありません。
    本発表ではまず、実際に悩んだPHPコードと、その採否を判断した経験について話します。
    そしてこの経験を元に、「AIの提案を読む時、何を知っていれば・どこを確認すれば良いと思うか」を発表します。
    また「次はここから始まる」の部分として、自分の設計判断をAIが再現できるよう、試したことと今思うコツについて、結論を伝えます。

